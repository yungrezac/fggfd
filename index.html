        body { background: transparent; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .hud-card {
            background: linear-gradient(180deg, rgba(20, 20, 20, 0.95) 0%, rgba(5, 5, 5, 0.98) 100%);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(80, 80, 80, 0.6);
            box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.8);
            transition: transform 0.2s ease-in-out, border-color 0.2s;
        }
        .hud-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(150, 150, 150, 0.8);
        }
        
        .text-outline { text-shadow: 1px 1px 2px black, -1px -1px 2px black, 1px -1px 2px black, -1px 1px 2px black, 0px 2px 4px rgba(0,0,0,0.8); }
        
        .coin-icon { 
            width: 16px; 
            height: 16px; 
            fill: #FFD700; 
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.8)); 
        }
        
        /* Особый стиль для Удаления Доты */
        .delete-dota-card {
            border: 2px solid #FF0050;
            box-shadow: 0px 0px 25px rgba(255, 0, 80, 0.6);
            animation: dangerPulse 1.5s infinite alternate;
        }
        @keyframes dangerPulse {
            from { box-shadow: 0px 0px 15px rgba(255, 0, 80, 0.4); border-color: #FF0050; }
            to { box-shadow: 0px 0px 35px rgba(255, 0, 80, 1); border-color: #ff4d85; }
        }
        
        /* УВЕЛИЧЕННЫЕ ИКОНКИ ПОДАРКОВ */
        .tiktok-gift-icon {
            width: 44px;
            height: 44px;
            object-fit: contain;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.7));
        }

        /* Увеличенный бейджик с временем/уроном */
        .duration-badge {
            position: absolute;
            bottom: -8px;
            right: -8px;
            background: linear-gradient(180deg, #222, #000);
            color: #ccc;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid #555;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.8);
            line-height: 1.2;
            white-space: nowrap;
        }
    </style>

        const giftMappings = {
            'Rose': 'icon-rose',
            'Finger Heart': 'icon-heart',
            'Doughnut': 'icon-doughnut',
            'Hat and Mustache': 'icon-mustache',
            'Hearts': 'icon-hearts',
            'Corgi': 'icon-corgi',
            'Money Gun': 'icon-gun',
            'Galaxy': 'icon-galaxy',
            'Meteor Shower': 'icon-meteor',
            'TikTok Universe': 'icon-universe' // Вернули Universe обратно для подгрузки картинки
        };

        async function fetchGiftIcons() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/gift_library?select=name,icon`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                const gifts = await response.json();
                
                gifts.forEach(gift => {
                    const cleanName = gift.name.trim(); 
                    const elementId = giftMappings[cleanName];
                    
                    if (elementId && gift.icon) {
                        const imgElement = document.getElementById(elementId);
                        if (imgElement) {
                            imgElement.src = gift.icon; 
                        }
                    }
                });
            } catch (error) {
                console.error('[Supabase Fetch Error]', error);
            }
        }

        fetchGiftIcons();
    </script>
</body>
</html>
